org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.mpp.enableCInteropCommonization=true
kotlin.native.cacheKind=none

# Parallel Tooling API model building (IDE sync). Read by StartParameterBuildOptions
# only from Gradle 9.4+; the wrapper is on 8.14.3, so this is inert until that bump —
# kept here so the bump doesn't have to remember to re-add it. Ignored silently, no warning.
org.gradle.tooling.parallel=true
