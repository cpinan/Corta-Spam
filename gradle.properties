org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.mpp.enableCInteropCommonization=true
kotlin.native.cacheKind=none

# Parallel Tooling API model building (IDE sync). Read by StartParameterBuildOptions
# only from Gradle 9.4+; the wrapper is on 8.14.3, so this is inert until that bump —
# kept here so the bump doesn't have to remember to re-add it. Ignored silently, no warning.
org.gradle.tooling.parallel=true

# Play Console, release 8 (1.6.0): "Optimised resource shrinking isn't enabled".
# R8 then shrinks resources with the same reachability information it uses for code, instead of
# the older standalone shrinker's approximation. `isShrinkResources` was already on; this is the
# accurate implementation of it, and it is the default from AGP 9.
android.r8.optimizedResourceShrinking=true
