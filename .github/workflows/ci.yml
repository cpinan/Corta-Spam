name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ktlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Run ktlint
        run: ./gradlew ktlintCheck

  jvm-android:
    name: Shared (JVM) + Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v5

      - name: Verify SQLDelight migrations against schema baseline
        run: ./gradlew :shared:verifySqlDelightMigration

      - name: Assemble Android debug APK
        run: ./gradlew :androidApp:assembleDebug

      - name: Run shared module unit tests (JVM)
        run: ./gradlew :shared:testDebugUnitTest

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: shared-jvm-test-report
          path: shared/build/reports/tests/testDebugUnitTest

  ios:
    name: Shared (Kotlin/Native) + iOS
    # macos-26 (default Xcode 26.6) and not macos-15 (Xcode 16.4, iOS 18.5 SDK):
    # Compose Multiplatform 1.11.1's CMPLayoutRegion.o references UIViewLayoutRegion,
    # a UIKit class that only exists in the iOS 26 SDK. On an older SDK the shared
    # framework links with "Undefined symbols: _OBJC_CLASS_$_UIViewLayoutRegion".
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      # Printed so an image default moving out from under us is visible in the log
      # rather than showing up as an unexplained linker error.
      - name: Show selected Xcode and iOS SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Run shared module unit tests (Kotlin/Native, iOS simulator)
        run: ./gradlew :shared:iosSimulatorArm64Test

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate iosApp.xcodeproj
        working-directory: iosApp
        run: xcodegen generate

      - name: Build iosApp for the simulator
        run: >
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -configuration Debug build
